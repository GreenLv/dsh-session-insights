# Official rc.1 composition for the real-executor integration checks
# (scripts/dsh-services.mjs --executors). This is a minimal host composition:
# the service providers the PTC stack requires, mounted through the official
# loader against the exact tests/dsh-host closure. The Session/query/tools/
# system-prompt services and the plugin under test mount on the booted
# context exactly as the zero-model contract checks always have.
- id: fs
  name: '@deepseek-ai/dsh-fs-local'
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
- id: sessionProjections
  name: '@deepseek-ai/dsh-session-projection'
- id: sandboxPolicy
  name: '@deepseek-ai/dsh-sandbox-policy'
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
- id: ptcRuntime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
