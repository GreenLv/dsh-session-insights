name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tests/rc2-runtime --ignore-scripts
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m unittest discover -s tests -v
        env:
          DSH_RUNTIME: tests/rc2-runtime
      - run: python scripts/build_native_rules.py --check
      - run: npm test
      - run: python scripts/build_fixture.py --check
      - run: python scripts/audit_public_tree.py --root .

  rc2-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22.19.0'}
          - {os: macos-latest, node: '22.19.0'}
          - {os: windows-latest, node: '22.19.0'}
          - {os: ubuntu-latest, node: '24.8.0'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tests/rc2-runtime --ignore-scripts
      - run: node scripts/verify_session_contract.mjs --fixture --runtime tests/rc2-runtime --expected-dsh-version 0.1.7-rc.2 --required
      - run: node scripts/rc2-contract-tests.mjs tests/rc2-runtime
      - run: node scripts/rc2-services.mjs tests/rc2-runtime
      - run: npm test
