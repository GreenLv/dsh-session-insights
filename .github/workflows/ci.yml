name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tests/dsh-runtime --ignore-scripts
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m unittest discover -s tests -v
        env:
          DSH_RUNTIME: tests/dsh-runtime
      - run: python scripts/build_native_rules.py --check
      - run: npm test
      - run: python scripts/build_fixture.py --check
      - run: python scripts/audit_public_tree.py --root .

  dependency-security:
    # Runtime and development dependency auditing. A scan that cannot reach
    # its advisory database fails the job (never counts as a pass); applicable
    # high/critical findings block the candidate. Exceptions need a recorded
    # CVE, affected path, exploit precondition, expiry and maintainer decision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Audit production Node dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit the full Node dependency tree (high and above)
        run: npm audit --audit-level=high
      - name: Audit Python runtime and development dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python scripts/audit_python_deps.py

  dsh-contract:
    # rc.3 is the primary acceptance host; rc.2 keeps compatibility coverage.
    # Every matrix entry names its real runtime; each result records which
    # runtime actually ran.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22.19.0', dsh: '0.2.1-rc.3', runtime: tests/dsh-runtime-rc3, primary: true}
          - {os: macos-latest, node: '22.19.0', dsh: '0.2.1-rc.3', runtime: tests/dsh-runtime-rc3, primary: true}
          - {os: windows-latest, node: '22.19.0', dsh: '0.2.1-rc.3', runtime: tests/dsh-runtime-rc3, primary: true}
          - {os: ubuntu-latest, node: '24.8.0', dsh: '0.2.1-rc.3', runtime: tests/dsh-runtime-rc3, primary: true}
          - {os: ubuntu-latest, node: '22.19.0', dsh: '0.2.1-rc.2', runtime: tests/dsh-runtime, primary: false}
          - {os: windows-latest, node: '22.19.0', dsh: '0.2.1-rc.2', runtime: tests/dsh-runtime, primary: false}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix ${{ matrix.runtime }} --ignore-scripts
      - name: Install the matching full host tree
        run: npm ci --prefix ${{ matrix.dsh == '0.2.1-rc.3' && 'tests/dsh-host-rc3' || 'tests/dsh-host' }} --ignore-scripts
      - name: Verify the runtime really is the claimed DSH version
        run: node scripts/verify_dsh_admission.mjs ${{ matrix.dsh == '0.2.1-rc.3' && 'tests/dsh-host-rc3' || 'tests/dsh-host' }} ${{ matrix.dsh }}
      - run: node scripts/verify_session_contract.mjs --fixture --runtime ${{ matrix.runtime }} --expected-dsh-version ${{ matrix.dsh }} --required
      - run: node scripts/dsh-repair-fixtures.mjs ${{ matrix.runtime }} --check
      - run: node scripts/dsh-contract-tests.mjs ${{ matrix.runtime }}
      - run: node scripts/dsh-services.mjs ${{ matrix.runtime }}
      - run: npm test
      - name: Freeze the candidate artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0' && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: node scripts/pack_candidate.mjs "$GITHUB_SHA" "$RUNNER_TEMP/candidate"
      - name: Retain candidate bytes and inventory
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0' && github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-tgz
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
