name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.9.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      # One current runtime tree: every cell installs the same exact rc.1
      # runtime that the dsh-contract job accepts.
      - run: npm ci --prefix tests/dsh-runtime --ignore-scripts
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m unittest discover -s tests -v
        env:
          DSH_RUNTIME: tests/dsh-runtime
          DSH_EXPECTED_VERSION: '0.2.2-rc.1'
      - run: python scripts/build_native_rules.py --check
      - run: python scripts/build_fixture.py --check
      - run: python scripts/audit_public_tree.py --root .

  dependency-security:
    # Runtime and development dependency auditing. A scan that cannot reach
    # its advisory database fails the job. Only the exact single-release,
    # host/lock-bound upstream exception is eligible; raw npm exits stay intact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.9.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Audit production Node dependencies and retain raw results
        id: audit_prod
        if: always()
        continue-on-error: true
        run: node scripts/audit_node_deps.mjs --scope prod --output reports/dependency-audit/prod
      - name: Audit the full Node dependency tree and retain raw results
        id: audit_full
        if: always()
        continue-on-error: true
        run: node scripts/audit_node_deps.mjs --scope full --output reports/dependency-audit/full
      - name: Audit Python runtime and development dependencies
        id: audit_python
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports/dependency-audit
          python -m pip install --disable-pip-version-check pip-audit 2>&1 | tee reports/dependency-audit/python-install.log
          python scripts/audit_python_deps.py 2>&1 | tee reports/dependency-audit/python.log
      - name: Require all three audits and validate the narrow exception
        if: always()
        env:
          AUDIT_PROD_OUTCOME: ${{ steps.audit_prod.outcome }}
          AUDIT_FULL_OUTCOME: ${{ steps.audit_full.outcome }}
          AUDIT_PYTHON_OUTCOME: ${{ steps.audit_python.outcome }}
        run: node scripts/audit_node_deps.mjs --verify-results reports/dependency-audit
      - name: Retain raw dependency audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: reports/dependency-audit
          if-no-files-found: error

  dsh-contract:
    # 0.2.2-rc.1 is the sole acceptance host on the Node 24.9.0 floor across
    # all three OSes; one additional lane probes a newer Node on the same host.
    # Every matrix entry names its real runtime; each result records which
    # runtime actually ran.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '24.9.0', dsh: '0.2.2-rc.1', runtime: tests/dsh-runtime, primary: true}
          - {os: macos-latest, node: '24.9.0', dsh: '0.2.2-rc.1', runtime: tests/dsh-runtime, primary: true}
          - {os: windows-latest, node: '24.9.0', dsh: '0.2.2-rc.1', runtime: tests/dsh-runtime, primary: true}
          - {os: ubuntu-latest, node: '25', dsh: '0.2.2-rc.1', runtime: tests/dsh-runtime, primary: false}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix ${{ matrix.runtime }} --ignore-scripts
      - name: Install the matching full host tree
        run: npm ci --prefix tests/dsh-host --ignore-scripts
      - name: Verify the runtime really is the claimed DSH version
        run: node scripts/verify_dsh_admission.mjs tests/dsh-host ${{ matrix.dsh }} --runtime ${{ matrix.runtime }}
      - run: node scripts/verify_session_contract.mjs --fixture --runtime ${{ matrix.runtime }} --expected-dsh-version ${{ matrix.dsh }} --required
      - run: node scripts/dsh-repair-fixtures.mjs ${{ matrix.runtime }} --check
      - run: node scripts/dsh-contract-tests.mjs ${{ matrix.runtime }}
      - run: node scripts/dsh-services.mjs ${{ matrix.runtime }}
      # Real-executor and Agent-scope integration: the official native/PTC
      # executors over the official composition; the full host closure lives
      # in tests/dsh-host, so this step runs once per OS on the primary lane.
      - run: node scripts/dsh-executor-contract.mjs tests/dsh-host
        if: matrix.primary == true
      - run: npm test
        env:
          DSH_RUNTIME: ${{ matrix.runtime }}
          DSH_EXPECTED_VERSION: ${{ matrix.dsh }}
      # CI above exercises GitHub's PR merge checkout. The one candidate
      # producer separately packs the exact PR head, without relabelling the
      # merge checkout as the source commit.
      - name: Check out exact PR head for packing
        if: matrix.primary == true && matrix.os == 'ubuntu-latest' && matrix.node == '24.9.0' && github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-head
          persist-credentials: false
      - name: Freeze the candidate artifact
        if: matrix.primary == true && matrix.os == 'ubuntu-latest' && matrix.node == '24.9.0' && github.event_name == 'pull_request'
        working-directory: candidate-head
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pack_candidate.mjs "$CANDIDATE_COMMIT" "$RUNNER_TEMP/candidate"
      - name: Retain candidate bytes and inventory
        if: matrix.primary == true && matrix.os == 'ubuntu-latest' && matrix.node == '24.9.0' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-tgz
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
