name: windows-host-acceptance

# Portable zero-model Windows host acceptance for one exact candidate.
# mode=pack freezes the candidate .tgz once and uploads it with its SHA-256.
# mode=windows-accept reads that same artifact back by run id, verifies the
# accepted digest, and runs scripts/verify_host_acceptance.mjs on hosted
# Windows. The annex records every check; full host app/GUI gates stay open.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pack (freeze candidate tgz) or windows-accept (verify accepted artifact)'
        required: true
        default: 'pack'
        type: choice
        options:
          - pack
          - windows-accept
      commit:
        description: 'Exact candidate commit (full SHA) to check out in both modes'
        required: true
      artifact_run_id:
        description: 'windows-accept only: producer run id that uploaded the frozen tgz'
        required: false
      artifact_name:
        description: 'windows-accept only: producer artifact name'
        required: false
        default: 'candidate-tgz'
      expected_sha256:
        description: 'windows-accept only: accepted artifact SHA-256 (lowercase hex)'
        required: false

permissions:
  contents: read

concurrency:
  group: windows-host-acceptance-${{ github.workflow }}-${{ inputs.commit }}-${{ inputs.mode }}
  cancel-in-progress: false

env:
  CANDIDATE_COMMIT: ${{ inputs.commit }}
  ACCEPTED_SHA256: ${{ inputs.expected_sha256 }}
  PRODUCER_RUN: ${{ inputs.artifact_run_id }}
  PRODUCER_ARTIFACT: ${{ inputs.artifact_name }}

jobs:
  pack:
    if: ${{ inputs.mode == 'pack' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable input
        run: '[[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: npm ci --ignore-scripts
      - run: node scripts/pack_candidate.mjs "$CANDIDATE_COMMIT" "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-tgz
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error

  windows-accept:
    if: ${{ inputs.mode == 'windows-accept' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate immutable inputs
        shell: pwsh
        run: |
          if ($env:CANDIDATE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:ACCEPTED_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:PRODUCER_RUN -notmatch '^[0-9]+$' -or $env:PRODUCER_ARTIFACT -notmatch '^[A-Za-z0-9._-]+$') { throw 'Invalid immutable inputs' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact checkout
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:CANDIDATE_COMMIT) { throw 'Checkout identity mismatch' }
      - name: Read back the frozen producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the accepted artifact digest
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem candidate/dsh-session-insights-*.tgz)
          if ($packages.Count -ne 1) { throw 'Exactly one candidate tgz required' }
          $tgz = $packages[0]
          $hash = (Get-FileHash $tgz.FullName -Algorithm SHA256).Hash.ToLower()
          "artifact=$($tgz.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($hash -cne $env:ACCEPTED_SHA256) {
            Write-Error "artifact digest mismatch: $hash"
            exit 1
          }
          "digest $hash matches the accepted artifact"
      - name: Install the exact target runtime and host
        shell: pwsh
        run: |
          npm ci --prefix tests/dsh-runtime --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Runtime install failed' }
          npm install --prefix host-home @deepseek-ai/dsh@0.2.0-rc.1 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Host install failed' }
          npm install --global pnpm@11.22.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          python -m pip install --disable-pip-version-check -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw 'Annex validator dependencies failed' }
      - name: Run the zero-model host acceptance entry
        shell: pwsh
        run: |
          $tgz = (Get-ChildItem candidate/dsh-session-insights-*.tgz | Select-Object -First 1).Name
          node scripts/verify_host_acceptance.mjs `
            --package "candidate/$tgz" `
            --expected-sha256 $env:ACCEPTED_SHA256 `
            --commit $env:CANDIDATE_COMMIT `
            --runtime tests/dsh-runtime `
            --host host-home `
            --workdir $env:RUNNER_TEMP `
            --annex native-acceptance/annex.json
          if ($LASTEXITCODE -ne 0) { throw 'Portable installed-artifact acceptance failed' }
          python scripts/validate_host_annex.py native-acceptance/annex.json
          if ($LASTEXITCODE -ne 0) { throw 'Invalid acceptance annex' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-acceptance-v2-annex
          path: native-acceptance/annex.json
          if-no-files-found: error
