[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-session-insights"
version = "0.3.0"
description = "Local-first, evidence-backed workflow retrospectives for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Gerui Lv"}]
dependencies = ["zstandard>=0.23,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]

[project.scripts]
dsh-session-insights = "dsh_session_insights.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
dsh_session_insights = ["assets/*.html", "skill/SKILL.md", "skill/scripts/*.py"]
